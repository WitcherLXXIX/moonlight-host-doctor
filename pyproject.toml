[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moonlight-host-doctor"
version = "0.1.0"
description = "Read-only diagnostics for a Sunshine game-streaming host on Linux"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
moonlight-host-doctor = "moonlight_host_doctor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/moonlight_host_doctor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
